<nav class="fixed top-0 w-full bg-white h-16 flex items-center justify-between px-6 shadow-sm z-50">
    <div class="flex items-center gap-4">
      <button (click)="state.toggleSidebar()" class="p-2 hover:bg-gray-100 rounded-full">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <a routerLink="/" class="text-xl font-bold text-red-600 flex gap-4 items-center"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-play-icon lucide-square-play"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997A1 1 0 0 1 9 14.996z"/></svg> MyYoutube</a>
    </div>

    <div class="flex-1 max-w-2xl px-4 flex">
      <input type="text" placeholder="Rechercher..." class="w-full px-4 py-2 border rounded-l-full focus:outline-none focus:border-blue-500">
      <button class="px-6 bg-gray-100 border border-l-0 rounded-r-full hover:bg-gray-200"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search-icon lucide-search"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></button>
    </div>

    <div class="flex items-center gap-4">
      @if (state.isLoggedIn()) {
        <span class="font-medium text-gray-800">{{ state.currentUser()?.pseudo }}</span>
        <button (click)="state.logout()" class="px-4 py-2 text-sm text-red-600 hover:bg-red-50 rounded-full font-medium">
          Se déconnecter
        </button>
      } @else {
        <a routerLink="/login" class="px-4 py-2 text-blue-600 font-medium hover:bg-blue-50 rounded-full">Se connecter</a>
        <a routerLink="/register" class="px-4 py-2 bg-blue-600 text-white font-medium rounded-full hover:bg-blue-700">S'inscrire</a>
      }
    </div>
</nav>
