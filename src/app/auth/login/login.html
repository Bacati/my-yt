<div class="max-w-md mx-auto mt-20 p-6 bg-white rounded-xl shadow-md border border-gray-100">
    <h2 class="text-2xl font-bold mb-6 text-center">Se connecter</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Pseudo</label>
        <input type="text" formControlName="pseudo" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
        <input type="password" formControlName="password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      @if (errorMessage) {
        <p class="text-sm text-red-600 bg-red-50 p-3 rounded-lg">{{ errorMessage }}</p>
      }

      <button type="submit" [disabled]="loginForm.invalid" class="w-full py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50">
        Connexion
      </button>
    </form>
</div>
